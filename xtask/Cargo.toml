[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.89"
clap = { version = "4.5.4", features = ["derive", "suggestions"] }
log = "0.4.21"
clap-verbosity-flag = "3.0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.20"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
