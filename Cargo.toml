[workspace]
resolver = "3"
members = [
    "library/macros",
    "library/sbi-rt",
    "library/sbi-spec",
    "library/sbi-testing",
    "library/rustsbi",
    "library/riscv-aia",
    "library/riscv-cove",
    "library/riscv-cove-rt",
    "library/rpmi",
    "library/penglai",
    "library/pmpm",
    "library/smm",
    "firmware/macros",
    "firmware/runtime",
    "firmware/prototyper",
    "firmware/bench-kernel",
    "firmware/test-kernel",
    "arceboot",
    "xtask",
]
# Default Cargo commands operate on host-testable libraries.
# `sbi-testing` is checked on RISC-V targets in CI. Firmware and ArceBoot
# are built through xtask.
default-members = [
    "library/macros",
    "library/sbi-rt",
    "library/sbi-spec",
    "library/rustsbi",
    "library/riscv-aia",
    "library/riscv-cove",
    "library/riscv-cove-rt",
    "library/rpmi",
    "library/penglai",
    "library/pmpm",
    "library/smm",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MulanPSL-2.0 OR MIT"
repository = "https://github.com/rustsbi/rustsbi"

[profile.release]
debug = true

[workspace.dependencies]
riscv = { version = "0.16.1", default-features = false }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
