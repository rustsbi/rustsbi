name: openEuler

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-boot*.sh"
      - ".github/workflows/openeuler.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main", "ci/**"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-boot*.sh"
      - ".github/workflows/openeuler.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  openeuler-boot:
    name: Boot openEuler 25.09 (${{ matrix.boot-mode }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        boot-mode: [edk2, u-boot, sbi]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install emulation dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo timeout 5m apt-get "${apt_options[@]}" update --error-on=any
          # Ubuntu 26.04 supplies QEMU through HWE packages; package revisions rotate.
          sudo timeout 5m apt-get "${apt_options[@]}" install -y --no-install-recommends \
            curl xz-utils shellcheck dpkg mtools \
            qemu-system-riscv-hwe qemu-utils-hwe
          dpkg-query -W qemu-system-riscv-hwe qemu-utils-hwe
          qemu-system-riscv64 --version

      - name: Check script syntax and offline failure handling
        run: |
          bash -n .github/scripts/prototyper-openeuler-boot.sh
          shellcheck .github/scripts/prototyper-openeuler-boot.sh
          .github/scripts/prototyper-openeuler-boot.sh --self-test

      - name: Install cargo-binutils
        run: cargo install --locked cargo-binutils@0.4.0

      # Only digest-verified archives and release firmware are cached. Each run
      # extracts a fresh base disk and uses a disposable qcow2 overlay and VARS.
      - name: Cache openEuler downloads
        uses: actions/cache@v5
        with:
          path: target/openeuler-boot/cache
          key: openeuler-25.09-5ba2eb5f-${{ matrix.boot-mode }}-u-boot-852a1f5d-v1

      - name: Build current RustSBI Prototyper
        run: |
          set -o pipefail
          mkdir -p qemu-logs
          cargo prototyper build 2>&1 | tee qemu-logs/prototyper-openeuler-build.log

      - name: Boot openEuler through ${{ matrix.boot-mode }}
        run: .github/scripts/prototyper-openeuler-boot.sh ${{ matrix.boot-mode }}

      - name: Upload serial log and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openeuler-${{ matrix.boot-mode }}-logs
          path: qemu-logs/prototyper-openeuler-*.log
          if-no-files-found: warn
