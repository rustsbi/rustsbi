name: openEuler

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-boot*.sh"
      - ".github/workflows/openeuler.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main", "ci/**"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-boot*.sh"
      - ".github/workflows/openeuler.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  openeuler-boot:
    name: Boot openEuler 25.09 (${{ matrix.boot-mode }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        boot-mode: [edk2, u-boot, sbi]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install emulation dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo timeout 5m apt-get "${apt_options[@]}" update --error-on=any
          # Ubuntu 26.04 supplies QEMU through HWE packages; package revisions rotate.
          sudo timeout 5m apt-get "${apt_options[@]}" install -y --no-install-recommends \
            bc bison build-essential curl device-tree-compiler dpkg flex \
            gcc-riscv64-linux-gnu git libgnutls28-dev libssl-dev make mtools \
            python3 python3-dev python3-setuptools shellcheck swig \
            u-boot-tools xz-utils \
            qemu-system-riscv-hwe qemu-utils-hwe
          dpkg-query -W qemu-system-riscv-hwe qemu-utils-hwe
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"

      - name: Check script syntax and offline failure handling
        run: |
          bash -n .github/scripts/prototyper-openeuler-boot.sh
          shellcheck -x .github/scripts/prototyper-openeuler-boot.sh
          .github/scripts/prototyper-openeuler-boot.sh --self-test

      - name: Install cargo-binutils
        run: cargo install --locked cargo-binutils@0.4.0

      # The pinned mirror has timed out repeatedly, so keep the verified image
      # and release firmware on main rather than depending on it for every PR.
      - name: Cache openEuler guest image
        uses: ./.github/actions/ci-cache
        with:
          path: target/openeuler-boot/cache/openEuler-25.09-riscv64.qcow2.xz
          key: openeuler-25.09-image-5ba2eb5f-v2

      - name: Cache openEuler EDK II release firmware
        if: matrix.boot-mode == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: |
            target/openeuler-boot/cache/RISCV_VIRT_CODE.fd
            target/openeuler-boot/cache/RISCV_VIRT_VARS.fd
          key: openeuler-25.09-release-fds-58e96e55-ea8094e9-v2

      - name: Cache U-Boot build
        if: matrix.boot-mode == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build current RustSBI Prototyper
        run: |
          set -o pipefail
          mkdir -p qemu-logs
          cargo prototyper build 2>&1 | tee qemu-logs/prototyper-openeuler-build.log

      - name: Boot openEuler through ${{ matrix.boot-mode }}
        run: .github/scripts/prototyper-openeuler-boot.sh ${{ matrix.boot-mode }}

      - name: Save openEuler guest image
        uses: ./.github/actions/ci-cache-save
        with:
          path: target/openeuler-boot/cache/openEuler-25.09-riscv64.qcow2.xz
          key: openeuler-25.09-image-5ba2eb5f-v2

      - name: Save openEuler EDK II release firmware
        if: matrix.boot-mode == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: |
            target/openeuler-boot/cache/RISCV_VIRT_CODE.fd
            target/openeuler-boot/cache/RISCV_VIRT_VARS.fd
          key: openeuler-25.09-release-fds-58e96e55-ea8094e9-v2

      - name: Save U-Boot build
        if: matrix.boot-mode == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload serial log and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openeuler-${{ matrix.boot-mode }}-logs
          path: qemu-logs/prototyper-openeuler-*.log
          if-no-files-found: warn
