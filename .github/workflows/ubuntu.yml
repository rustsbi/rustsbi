name: Ubuntu

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-ubuntu-boot.sh"
      - ".github/workflows/ubuntu.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-ubuntu-boot.sh"
      - ".github/workflows/ubuntu.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ubuntu-boot:
    name: Boot Ubuntu 24.04.5 (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path: [u-boot, edk2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools bc bison build-essential cloud-image-utils \
            device-tree-compiler flex gcc-riscv64-linux-gnu git \
            libgnutls28-dev libssl-dev make nasm python3 python3-dev \
            python3-setuptools qemu-system-riscv qemu-utils swig uuid-dev \
            xz-utils zlib1g-dev
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install cargo-binutils
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-26.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper and boot Ubuntu
        run: |
          cargo prototyper build
          .github/scripts/prototyper-ubuntu-boot.sh "${{ matrix.boot-path }}"

      - name: Save EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-26.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload Ubuntu serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-ubuntu-${{ matrix.boot-path }}.log
          if-no-files-found: warn
