name: Ubuntu

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-ubuntu-boot.sh"
      - ".github/workflows/ubuntu.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-ubuntu-boot.sh"
      - ".github/workflows/ubuntu.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ubuntu-boot:
    name: Boot Ubuntu 24.04.5 (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path: [u-boot, edk2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cloud-image-utils qemu-system-riscv qemu-utils xz-utils
          qemu-system-riscv64 --version

      - name: Install cargo-binutils
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache Ubuntu image
        uses: actions/cache@v5
        with:
          path: target/ubuntu-boot/cache/24.04.5/*.xz
          key: ubuntu-24.04.5-riscv64-1cbd4b187f333561

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/ci-uboot/packages/2025.10-0ubuntu0.24.04.2
          key: uboot-package-2025.10-0ubuntu0.24.04.2-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper and boot Ubuntu
        run: |
          cargo prototyper build
          .github/scripts/prototyper-ubuntu-boot.sh "${{ matrix.boot-path }}"

      - name: Upload Ubuntu serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-ubuntu-${{ matrix.boot-path }}.log
          if-no-files-found: warn
