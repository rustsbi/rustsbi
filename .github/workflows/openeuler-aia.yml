name: Compat / Linux / openEuler AIA

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-aia.sh"
      - ".github/workflows/openeuler-aia.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openeuler-aia.sh"
      - ".github/workflows/openeuler-aia.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  openeuler-aia-boot:
    name: Boot openEuler 25.09 with AIA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zstd

      - name: Install required cargo
        uses: ./.github/actions/setup-cargo-binutils

      # Share the same verified image and release firmware cache as the
      # standard openEuler boot workflow.
      - name: Cache openEuler guest image
        uses: ./.github/actions/ci-cache
        with:
          path: target/openeuler-boot/cache/openEuler-25.09-riscv64.qcow2.xz
          key: openeuler-25.09-image-5ba2eb5f-v2

      - name: Cache openEuler EDK II release firmware
        uses: ./.github/actions/ci-cache
        with:
          path: |
            target/openeuler-boot/cache/RISCV_VIRT_CODE.fd
            target/openeuler-boot/cache/RISCV_VIRT_VARS.fd
          key: openeuler-25.09-release-fds-58e96e55-ea8094e9-v2

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot openEuler with AIA
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e OPENEULER_AIA_CACHE_DIR=/work/target/openeuler-boot/cache \
            -e OPENEULER_AIA_WORK_DIR=/work/.openeuler-aia/work \
            -e OPENEULER_AIA_LOG_DIR=/work/qemu-logs \
            ubuntu:26.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              # Use the same Ubuntu mirror as the Azure-hosted runner.
              sed -i -E \
                "s@http://(archive|security).ubuntu.com/ubuntu/?@http://azure.archive.ubuntu.com/ubuntu/@g" \
                /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
              timeout 5m apt-get "${apt_options[@]}" update --error-on=any
              # virtio-vga needs the VGA ROM from seabios even with -nographic.
              timeout 5m apt-get "${apt_options[@]}" install -y --no-install-recommends \
                ca-certificates curl qemu-system-riscv qemu-utils seabios xz-utils zstd
              qemu-system-riscv64 --version
              .github/scripts/prototyper-openeuler-aia.sh
            '

      - name: Save openEuler guest image
        uses: ./.github/actions/ci-cache-save
        with:
          path: target/openeuler-boot/cache/openEuler-25.09-riscv64.qcow2.xz
          key: openeuler-25.09-image-5ba2eb5f-v2

      - name: Save openEuler EDK II release firmware
        uses: ./.github/actions/ci-cache-save
        with:
          path: |
            target/openeuler-boot/cache/RISCV_VIRT_CODE.fd
            target/openeuler-boot/cache/RISCV_VIRT_VARS.fd
          key: openeuler-25.09-release-fds-58e96e55-ea8094e9-v2

      - name: Upload openEuler AIA log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openeuler-aia-log
          path: |
            qemu-logs/openeuler-aia.log
            qemu-logs/openeuler-aia-aplic.trace
