name: Arch Linux

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-archlinux-boot.sh"
      - ".github/workflows/archlinux.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-archlinux-boot.sh"
      - ".github/workflows/archlinux.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  archlinux-boot:
    name: Boot Arch Linux (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
          - edk2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools bc bison build-essential curl dosfstools e2fsprogs \
            flex gcc-riscv64-linux-gnu git kmod libgnutls28-dev libssl-dev \
            make nasm parted python3 python3-dev python3-setuptools \
            qemu-system-misc qemu-utils swig udev util-linux uuid-dev \
            xz-utils zstd
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install required cargo tool
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache built Arch Linux Image
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/archlinux/linux-6.15.9-Image
          key: archlinux-linux-6.15.9-v1

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/archlinux-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-archlinux-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot Arch Linux
        run: .github/scripts/prototyper-archlinux-boot.sh "${{ matrix.boot-path }}"

      - name: Save built Arch Linux Image
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/archlinux/linux-6.15.9-Image
          key: archlinux-linux-6.15.9-v1

      - name: Save EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/archlinux-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-archlinux-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload Arch Linux serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-serial-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-archlinux-${{ matrix.boot-path }}.log
          if-no-files-found: warn
