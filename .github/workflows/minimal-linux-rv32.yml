name: Minimal Linux RV32

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-rv32-boot.sh"
      - ".github/workflows/minimal-linux-rv32.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-rv32-boot.sh"
      - ".github/workflows/minimal-linux-rv32.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  minimal-linux-rv32-boot:
    name: Boot minimal Linux RV32 (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Ubuntu ships no riscv32 cross toolchain, so the pinned Bootlin
      # toolchain is downloaded by the boot script and cached here together
      # with the other immutable build products.
      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            e2fsprogs \
            flex \
            git \
            libssl-dev \
            parted \
            python3 \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            qemu-utils \
            swig \
            xz-utils
          qemu-system-riscv32 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # All three inputs are immutable releases, so the key only changes when
      # a pinned version does. Bump the trailing revision after editing the
      # build recipes in the script.
      - name: Cache toolchain, Linux kernel and BusyBox builds
        uses: actions/cache@v5
        with:
          path: |
            .cache/minimal-linux-rv32/riscv32-ilp32d--glibc--stable-2024.05-1
            .cache/minimal-linux-rv32/linux-6.12.110-Image
            .cache/minimal-linux-rv32/busybox-1.36.1-install
          key: minimal-linux-rv32-toolchain-2024.05-kernel-6.12.110-busybox-1.36.1-v1

      - name: Build RustSBI Prototyper (RV32)
        run: cargo prototyper build --target riscv32imac-unknown-none-elf

      - name: Boot minimal Linux RV32
        run: .github/scripts/prototyper-minimal-linux-rv32-boot.sh "${{ matrix.boot-path }}"

      - name: Upload minimal Linux RV32 log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimal-linux-rv32-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-minimal-linux-rv32-${{ matrix.boot-path }}.log
