name: Debian

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-debian-boot.sh"
      - ".github/workflows/debian.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-debian-boot.sh"
      - ".github/workflows/debian.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  debian-boot:
    name: Boot Debian 13 (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison device-tree-compiler flex gcc-riscv64-linux-gnu \
            git libgnutls28-dev libssl-dev make python3-dev python3-setuptools \
            qemu-system-riscv qemu-utils swig u-boot-tools util-linux
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache Debian image
        uses: actions/cache@v5
        with:
          path: .cache/debian/13
          key: debian-13-nocloud-riscv64-20260914-2601

      - name: Cache U-Boot source
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/u-boot/v2026.07
          key: u-boot-ece349ade2973e220f524ce59e59711cc919263f

      - name: Build RustSBI Prototyper and boot Debian
        run: |
          cargo prototyper build
          .github/scripts/prototyper-debian-boot.sh "${{ matrix.boot-path }}"

      - name: Upload Debian serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-debian-${{ matrix.boot-path }}.log
          if-no-files-found: warn
