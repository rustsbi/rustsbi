name: Compat / Linux / eweOS

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-eweos-boot.sh"
      - ".github/workflows/eweos.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-eweos-boot.sh"
      - ".github/workflows/eweos.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  eweos-boot:
    name: Boot eweOS (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
          - edk2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Resolve once for this boot job; all later steps keep this digest.
      - name: Read official eweOS checksum
        id: iso
        run: |
          digest=$(.github/scripts/prototyper-eweos-boot.sh resolve-iso)
          echo "sha256=$digest" >>"$GITHUB_OUTPUT"
          echo "EWEOS_ISO_SHA256=$digest" >>"$GITHUB_ENV"
          echo "eweOS ISO SHA-256: $digest"

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools \
            bc \
            bison \
            build-essential \
            dosfstools \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libarchive-tools \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libssl-dev \
            mtools \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-venv \
            swig \
            uuid-dev \
            zlib1g-dev

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        uses: ./.github/actions/setup-cargo-binutils

      # The script builds a pinned QEMU because Ubuntu 24.04's QEMU 8.2.2
      # stalls this boot at random; see the script header. Bump the trailing
      # revision after changing the configure flags in the script.
      - name: Cache QEMU build
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/eweos/qemu-10.2.2
          key: eweos-qemu-10.2.2-${{ runner.os }}-v1

      # Validate an ISO already present in the workspace, then let the boot
      # step download and verify the pinned release when it is absent.
      - name: Check existing eweOS ISO
        run: .github/scripts/prototyper-eweos-boot.sh check-iso

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/eweos-smode
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-eweos-smode-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot eweOS
        run: .github/scripts/prototyper-eweos-boot.sh "${{ matrix.boot-path }}"

      - name: Save QEMU build
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/eweos/qemu-10.2.2
          key: eweos-qemu-10.2.2-${{ runner.os }}-v1

      - name: Save EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/eweos-smode
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-eweos-smode-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload eweOS log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eweos-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-eweos-${{ matrix.boot-path }}.log
