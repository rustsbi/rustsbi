name: Compat / Linux / PolyOS

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-polyos-boot.sh"
      - ".github/workflows/polyos.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-polyos-boot.sh"
      - ".github/workflows/polyos.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  polyos-boot:
    name: Boot PolyOS (u-boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            bison \
            build-essential \
            curl \
            e2fsprogs \
            flex \
            gcc-riscv64-linux-gnu \
            libssl-dev \
            parted \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            qemu-utils \
            swig \
            xz-utils
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        uses: ./.github/actions/setup-cargo-binutils

      - name: Cache U-Boot build
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/polyos-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-polyos-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot PolyOS
        run: .github/scripts/prototyper-polyos-boot.sh

      - name: Save U-Boot build
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/polyos-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-polyos-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload PolyOS log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polyos-log-u-boot
          path: qemu-logs/prototyper-polyos-uboot.log
          if-no-files-found: ignore
