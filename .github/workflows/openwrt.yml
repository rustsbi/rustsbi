name: OpenWrt

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openwrt-boot.sh"
      - ".github/workflows/openwrt.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openwrt-boot.sh"
      - ".github/workflows/openwrt.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  openwrt-boot:
    name: Boot OpenWrt 25.12.5 (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            e2fsprogs \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            mtools \
            python3-dev \
            python3-setuptools \
            qemu-system-riscv \
            swig \
            util-linux
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache OpenWrt image
        uses: actions/cache@v5
        with:
          path: .cache/openwrt/25.12.5
          key: openwrt-25.12.5-sifive-unleashed-ext4

      - name: Cache U-Boot source
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/u-boot/v2026.07
          key: u-boot-ece349ade2973e220f524ce59e59711cc919263f

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot OpenWrt
        run: .github/scripts/prototyper-openwrt-boot.sh "${{ matrix.boot-path }}"

      - name: Upload OpenWrt serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-openwrt-${{ matrix.boot-path }}.log
          if-no-files-found: warn
