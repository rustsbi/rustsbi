name: OpenWrt

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openwrt-boot.sh"
      - ".github/workflows/openwrt.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openwrt-boot.sh"
      - ".github/workflows/openwrt.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  openwrt-boot:
    name: Boot OpenWrt 25.12.5 (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            e2fsprogs \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            mtools \
            python3-dev \
            python3-setuptools \
            qemu-system-riscv \
            swig \
            util-linux
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/spl-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-spl-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot OpenWrt
        run: .github/scripts/prototyper-openwrt-boot.sh "${{ matrix.boot-path }}"

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/spl-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-spl-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload OpenWrt serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-openwrt-${{ matrix.boot-path }}.log
          if-no-files-found: warn
