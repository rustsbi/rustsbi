name: FreeBSD

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-freebsd-boot.sh"
      - ".github/workflows/freebsd.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-freebsd-boot.sh"
      - ".github/workflows/freebsd.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  freebsd-boot:
    name: Boot FreeBSD 14.1 (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            device-tree-compiler \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            make \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            u-boot-tools \
            xz-utils
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/spl-2024.04
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-spl-2024.04-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper and boot FreeBSD
        run: |
          cargo prototyper build
          .github/scripts/prototyper-freebsd-boot.sh "${{ matrix.boot-path }}"

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/spl-2024.04
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-spl-2024.04-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload FreeBSD serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-freebsd-${{ matrix.boot-path }}.log
          if-no-files-found: warn
