name: ArceBoot

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'library/**'
      - 'firmware/**'
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'library/**'
      - 'firmware/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-clippy:
    name: Build and clippy analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check format
        run: cargo fmt --check -p arceboot

      - name: Install required cargo
        run: cargo install --locked clippy-sarif@0.8.0 sarif-fmt@0.8.0 cargo-binutils@0.4.0 axconfig-gen@0.2.1

      - name: Build ArceBoot
        run: cargo xtask arceboot

      - name: Run rust-clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p arceboot --target riscv64gc-unknown-none-elf --message-format=json \
            | clippy-sarif \
            | tee rust-clippy-results.sarif \
            | sarif-fmt

      - name: Upload analysis results to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  integration-test:
    name: QEMU integration tests (${{ matrix.bios_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bios_name: qemu-default
            bios_path: default
            bios_banner: OpenSBI
          - bios_name: rustsbi-v0.4.1
            bios_path: firmware/rustsbi-v0.4.1/target/riscv64gc-unknown-none-elf/release/rustsbi-prototyper-dynamic.elf
            bios_banner: "[RustSBI]"
    env:
      QEMU_BIOS: ${{ matrix.bios_path }}
      BIOS_BANNER: ${{ matrix.bios_banner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout pinned RustSBI v0.4.1
        if: matrix.bios_name == 'rustsbi-v0.4.1'
        uses: actions/checkout@v7
        with:
          repository: rustsbi/rustsbi
          ref: 1e10645e9a3cc6230988b037df506f97310555b7
          path: firmware/rustsbi-v0.4.1
          persist-credentials: false

      - name: Install required cargo
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-binutils@0.4.0 axconfig-gen@0.2.1

      - name: Build ArceBoot
        run: cargo xtask arceboot

      - name: Build pinned RustSBI dynamic firmware
        if: matrix.bios_name == 'rustsbi-v0.4.1'
        working-directory: firmware/rustsbi-v0.4.1
        run: |
          rustup target add riscv64gc-unknown-none-elf
          cargo prototyper --target riscv64gc-unknown-none-elf
          test -s target/riscv64gc-unknown-none-elf/release/rustsbi-prototyper-dynamic.elf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: |
          sudo apt update
          sudo apt install -y uuid-dev qemu-system-misc

      - name: Cache EDK2 build
        uses: actions/cache@v5
        id: cache-edk2
        with:
          path: arceboot/edk2/Build
          key: edk2-${{ runner.os }}-${{ hashFiles('arceboot/scripts/test/build_edk2.sh', 'arceboot/tests/edk2-*/**') }}-v2

      - name: Build EDK2
        if: steps.cache-edk2.outputs.cache-hit != 'true'
        run: bash arceboot/scripts/test/build_edk2.sh

      - name: Generate disk image
        run: bash arceboot/scripts/test/disk.sh

      # Test 1: HelloRiscv
      - name: Create ESP (HelloRiscv)
        run: |
          EFI_FILE="$(cd arceboot && find edk2/Build -type f -name HelloRiscv.efi -print -quit)"
          test -n "$EFI_FILE"
          EFI_FILE="$EFI_FILE" bash arceboot/scripts/test/make_esp.sh

      - name: Run QEMU (HelloRiscv)
        run: |
          timeout 60 qemu-system-riscv64 \
            -m 128M -serial mon:stdio -nographic -machine virt \
            -bios "$QEMU_BIOS" \
            -kernel target/riscv64gc-unknown-none-elf/release/arceboot.bin \
            -device virtio-blk-pci,drive=disk0 \
            -drive id=disk0,if=none,format=raw,file=arceboot/disk.img \
            > arceboot/qemu-hello-riscv.log 2>&1 || true

      - name: Upload QEMU log (HelloRiscv)
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.bios_name }}-hello-riscv
          path: arceboot/qemu-hello-riscv.log

      - name: Check BIOS identity
        run: grep -aqF "$BIOS_BANNER" arceboot/qemu-hello-riscv.log

      - name: Check QEMU output (HelloRiscv)
        run: bash arceboot/scripts/test/check_hello_test_riscv.sh

      # Test 2: AllocatePage
      - name: Create ESP (AllocatePage)
        run: |
          EFI_FILE="$(cd arceboot && find edk2/Build -type f -name AllocatePage.efi -print -quit)"
          test -n "$EFI_FILE"
          EFI_FILE="$EFI_FILE" bash arceboot/scripts/test/make_esp.sh

      - name: Run QEMU (AllocatePage)
        run: |
          timeout 60 qemu-system-riscv64 \
            -m 128M -serial mon:stdio -nographic -machine virt \
            -bios "$QEMU_BIOS" \
            -kernel target/riscv64gc-unknown-none-elf/release/arceboot.bin \
            -device virtio-blk-pci,drive=disk0 \
            -drive id=disk0,if=none,format=raw,file=arceboot/disk.img \
            > arceboot/qemu-allocate.log 2>&1 || true

      - name: Upload QEMU log (AllocatePage)
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.bios_name }}-allocate
          path: arceboot/qemu-allocate.log

      - name: Check QEMU output (AllocatePage)
        run: bash arceboot/scripts/test/check_allocate_test.sh

      # Test 3: Hello
      - name: Create ESP (Hello)
        run: |
          EFI_FILE="$(cd arceboot && find edk2/Build -type f -name Hello.efi -print -quit)"
          test -n "$EFI_FILE"
          EFI_FILE="$EFI_FILE" bash arceboot/scripts/test/make_esp.sh

      - name: Run QEMU (Hello)
        run: |
          timeout 60 qemu-system-riscv64 \
            -m 128M -serial mon:stdio -nographic -machine virt \
            -bios "$QEMU_BIOS" \
            -kernel target/riscv64gc-unknown-none-elf/release/arceboot.bin \
            -device virtio-blk-pci,drive=disk0 \
            -drive id=disk0,if=none,format=raw,file=arceboot/disk.img \
            > arceboot/qemu-hello.log 2>&1 || true

      - name: Upload QEMU log (Hello)
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.bios_name }}-hello
          path: arceboot/qemu-hello.log

      - name: Check QEMU output (Hello)
        run: bash arceboot/scripts/test/check_hello_test.sh
