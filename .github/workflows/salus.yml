name: Salus

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/salus/**"
      - ".github/scripts/prototyper-salus-boot.sh"
      - ".github/workflows/salus.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/salus/**"
      - ".github/scripts/prototyper-salus-boot.sh"
      - ".github/workflows/salus.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SALUS_BUILD_JOBS: 2

jobs:
  salus-boot:
    name: Boot Linux and confidential guest under Salus
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler file flex gcc-riscv64-linux-gnu git \
            libelf-dev libfdt-dev libglib2.0-dev libncurses-dev libpixman-1-dev \
            libslirp-dev libssl-dev ninja-build patch pkg-config python3 \
            python3-dev python3-setuptools python3-tomli python3-venv \
            rsync unzip wget xz-utils

      - name: Fingerprint dependency recipe and host toolchain
        id: recipe
        run: |
          recipe=$(bash .github/scripts/prototyper-salus-boot.sh fingerprint)
          printf 'sha=%s\n' "$recipe" >> "$GITHUB_OUTPUT"

      - name: Restore fixed Salus dependencies
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: target/prototyper-salus/cache/products
          key: salus-products-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.sha }}

      - name: Build fixed Salus dependencies
        run: bash .github/scripts/prototyper-salus-boot.sh prepare

      - name: Save fixed Salus dependencies before boot tests
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/prototyper-salus/cache/products
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Install Rust build tool
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Boot Linux userspace and Tellus confidential guest
        run: bash .github/scripts/prototyper-salus-boot.sh

      - name: Upload boot logs and dependency build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototyper-salus-logs
          path: qemu-logs/
          if-no-files-found: ignore
