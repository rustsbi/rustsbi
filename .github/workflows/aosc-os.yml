name: AOSC OS

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-aosc-os-boot.sh"
      - ".github/workflows/aosc-os.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-aosc-os-boot.sh"
      - ".github/workflows/aosc-os.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  aosc-os-boot:
    name: Boot AOSC OS (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl e2fsprogs flex \
            gcc-riscv64-linux-gnu gzip libc6-dev-riscv64-cross libgnutls28-dev \
            libssl-dev python3-dev python3-setuptools qemu-system-misc swig \
            tar xz-utils zstd
          qemu-system-riscv64 --version

      - name: Install required cargo tool
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache AOSC OS rootfs and generated initramfs
        uses: actions/cache@v5
        with:
          path: .cache/aosc-os
          key: aosc-os-20260621-initramfs-7.0.12-aosc-main-v1

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot AOSC OS
        run: .github/scripts/prototyper-aosc-os-boot.sh "${{ matrix.boot-path }}"

      - name: Upload AOSC OS serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aosc-os-serial-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-aosc-os-${{ matrix.boot-path }}.log
          if-no-files-found: warn
