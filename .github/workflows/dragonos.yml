name: DragonOS

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-dragonos-boot.sh"
      - ".github/workflows/dragonos.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-dragonos-boot.sh"
      - ".github/workflows/dragonos.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dragonos-boot:
    name: Boot DragonOS (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        boot-path: [sbi, u-boot, edk2]
    steps:
      - name: Checkout RustSBI
        uses: actions/checkout@v7

      - name: Install boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools bison build-essential ca-certificates curl device-tree-compiler \
            dosfstools fdisk flex gcc-riscv64-linux-gnu libc6-dev-riscv64-cross git libssl-dev \
            bzip2 mtools nasm python3 python3-dev python3-setuptools \
            qemu-system-misc swig util-linux uuid-dev xz-utils
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # RustSBI is rebuilt every run. The pinned DragonOS source produces both
      # the bare kernel image and the EFI payload containing that same kernel.
      # Bump the cache revision whenever the corresponding build recipe changes.
      - name: Cache DragonOS kernel and EFI payload
        uses: actions/cache@v5
        with:
          path: |
            .cache/dragonos-bootloaders/bootriscv64.efi
            .cache/dragonos-bootloaders/dragonos-kernel.bin
          key: dragonos-40572b45-stub-85156066-v3

      - name: Cache BusyBox userspace
        uses: actions/cache@v5
        with:
          path: .cache/dragonos-bootloaders/busybox
          key: dragonos-busybox-1.35.0-musl-b3833579-v1

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: actions/cache@v5
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/ci-uboot/builds/smode-2024.04
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-smode-2024.04-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot and exercise DragonOS userspace
        run: .github/scripts/prototyper-dragonos-boot.sh "${{ matrix.boot-path }}"

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dragonos-boot-${{ matrix.boot-path }}
          path: qemu-logs/dragonos/${{ matrix.boot-path }}/*.log
          if-no-files-found: ignore
