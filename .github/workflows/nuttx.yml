name: NuttX

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-nuttx-boot.sh"
      - ".github/workflows/nuttx.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-nuttx-boot.sh"
      - ".github/workflows/nuttx.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  nuttx-boot:
    name: Boot NuttX (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            curl \
            dosfstools \
            flex \
            gcc-riscv64-linux-gnu \
            gcc-riscv64-unknown-elf \
            genromfs \
            gettext \
            git \
            gperf \
            kconfig-frontends \
            libncurses5-dev \
            libssl-dev \
            mtools \
            python3 \
            qemu-system-misc \
            u-boot-tools \
            xxd \
            xz-utils
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # Both inputs are immutable commits, so the key only changes when a
      # pinned version does. Bump the trailing revision after editing the
      # build recipe in the script.
      - name: Cache NuttX build
        uses: actions/cache@v5
        with:
          path: .cache/nuttx/nuttx-63208908-c78e4d6
          key: nuttx-63208908-c78e4d6-v1

      # U-Boot's boot command is compiled in, so keep it in a separate cache
      # keyed on the pinned release. Bump the revision after editing the
      # boot command in the script.
      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: actions/cache@v5
        with:
          path: .cache/nuttx/u-boot-2024.04-smode
          key: nuttx-uboot-2024.04-v1

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot NuttX
        run: .github/scripts/prototyper-nuttx-boot.sh "${{ matrix.boot-path }}"

      - name: Upload NuttX log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuttx-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-nuttx-${{ matrix.boot-path }}.log
