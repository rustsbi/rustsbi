name: Alpine Linux

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-alpine-boot.sh"
      - ".github/workflows/alpine.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main", "ci/**"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-alpine-boot.sh"
      - ".github/workflows/alpine.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QEMU_PACKAGE_VERSION: "1:8.2.2+ds-0ubuntu1.18"

jobs:
  alpine-boot:
    name: Boot Alpine Linux (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        boot-path: [sbi, u-boot, edk2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools bc bison build-essential curl device-tree-compiler \
            flex gcc-riscv64-linux-gnu git gzip libgnutls28-dev libssl-dev make \
            nasm python3 python3-dev python3-setuptools swig u-boot-tools \
            uuid-dev xorriso zlib1g-dev \
            "qemu-system-misc=${QEMU_PACKAGE_VERSION}"
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Check serial acceptance and failure handling
        run: .github/scripts/prototyper-alpine-boot.sh --self-test

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot Alpine Linux
        run: .github/scripts/prototyper-alpine-boot.sh "${{ matrix.boot-path }}"

      - name: Save EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload Alpine serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alpine-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-alpine-${{ matrix.boot-path }}.log
          if-no-files-found: warn
