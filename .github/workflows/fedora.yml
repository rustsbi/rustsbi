name: Fedora

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-fedora-boot.sh"
      - ".github/workflows/fedora.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-fedora-boot.sh"
      - ".github/workflows/fedora.yml"
      - ".github/scripts/ci-uboot.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fedora-boot:
    name: Boot Fedora 44 Cloud (${{ matrix.boot-path }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison device-tree-compiler flex gcc-riscv64-linux-gnu \
            git libgnutls28-dev libssl-dev make python3-dev python3-setuptools \
            qemu-system-riscv qemu-utils swig u-boot-tools util-linux zstd
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/spl-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-spl-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper and boot Fedora
        run: |
          cargo prototyper build
          .github/scripts/prototyper-fedora-boot.sh "${{ matrix.boot-path }}"

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/spl-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-spl-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload Fedora serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fedora-serial-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-fedora-${{ matrix.boot-path }}.log
          if-no-files-found: warn
