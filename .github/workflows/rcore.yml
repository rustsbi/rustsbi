name: rCore

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-rcore-boot.sh"
      - ".github/workflows/rcore.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-rcore-boot.sh"
      - ".github/workflows/rcore.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rcore-boot:
    name: Boot rCore (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            curl \
            dosfstools \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libssl-dev \
            mtools \
            patch \
            python3 \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            qemu-utils \
            swig
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot rCore
        run: .github/scripts/prototyper-rcore-boot.sh "${{ matrix.boot-path }}"

      - name: Upload rCore log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rcore-log-${{ matrix.boot-path }}
          path: |
            qemu-logs/prototyper-rcore-${{ matrix.boot-path }}.log
            qemu-logs/prototyper-rcore-${{ matrix.boot-path }}-provenance.log
          if-no-files-found: warn
