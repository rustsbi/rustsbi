name: Compat / Linux / openRuyi

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openruyi-boot.sh"
      - ".github/scripts/prototyper-openruyi-server-workstation-boot.sh"
      - ".github/workflows/openruyi.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  push:
    branches: ["main", "ci/**"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-openruyi-boot.sh"
      - ".github/scripts/prototyper-openruyi-server-workstation-boot.sh"
      - ".github/workflows/openruyi.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
      - ".github/actions/setup-cargo-binutils/action.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  openruyi-zero-boot:
    name: Boot openRuyi 2026.08 Zero
    # The rva23s64 CPU model requires the QEMU version from Ubuntu 26.04.
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 qemu-system-riscv u-boot-tools
          qemu-system-riscv64 --version

      - name: Install required cargo
        uses: ./.github/actions/setup-cargo-binutils

      - name: Cache openRuyi Zero assets
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/openruyi/2026.08
          key: openruyi-zero-2026.08-rva23-v2

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot openRuyi Zero
        run: .github/scripts/prototyper-openruyi-boot.sh

      - name: Save openRuyi Zero assets
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/openruyi/2026.08
          key: openruyi-zero-2026.08-rva23-v2

      - name: Upload openRuyi log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openruyi-log
          path: qemu-logs/prototyper-openruyi.log

  openruyi-asset-seed:
    name: Seed openRuyi 2026.09 assets (${{ matrix.edition }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        edition: [server, workstation-labwc, workstation-kde]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install aria2
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo timeout 15m apt-get "${apt_options[@]}" update --error-on=any
          sudo timeout 15m apt-get "${apt_options[@]}" install -y --no-install-recommends aria2

      # This release host has failed transiently. Keep verified images on main
      # so later pull requests do not depend on a fresh multi-gigabyte download.
      - name: Cache openRuyi ${{ matrix.edition }} assets
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/openruyi/2026.09
          key: openruyi-2026.09-${{ matrix.edition }}-rva23-v2

      - name: Download openRuyi ${{ matrix.edition }} assets
        run: .github/scripts/prototyper-openruyi-server-workstation-boot.sh --prepare "${{ matrix.edition }}"

      # Pass restored or freshly downloaded assets within this workflow through
      # a short-lived artifact instead of restoring the same large image in
      # every boot job.
      - name: Share prepared openRuyi ${{ matrix.edition }} assets
        uses: actions/upload-artifact@v7
        with:
          name: openruyi-2026.09-${{ matrix.edition }}-assets
          path: .cache/openruyi/2026.09
          retention-days: 1

      - name: Save openRuyi ${{ matrix.edition }} assets
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/openruyi/2026.09
          key: openruyi-2026.09-${{ matrix.edition }}-rva23-v2

  openruyi-server-workstation-boot:
    name: Boot openRuyi 2026.09 ${{ matrix.edition }} (${{ matrix.boot-mode }})
    # The rva23s64 CPU model requires the QEMU version from Ubuntu 26.04.
    needs: openruyi-asset-seed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [server, workstation-labwc, workstation-kde]
        boot-mode: [sbi, u-boot, edk2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install emulation dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo timeout 15m apt-get "${apt_options[@]}" update --error-on=any
          sudo timeout 15m apt-get "${apt_options[@]}" install -y --no-install-recommends \
            acpica-tools aria2 bc bison build-essential device-tree-compiler \
            flex gcc-riscv64-linux-gnu git libarchive-tools libgnutls28-dev \
            libssl-dev make mtools nasm python3 python3-dev python3-setuptools \
            qemu-system-riscv qemu-utils shellcheck swig uuid-dev zlib1g-dev
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Check script syntax and offline failure handling
        run: |
          bash -n .github/scripts/prototyper-openruyi-server-workstation-boot.sh
          shellcheck -x .github/scripts/prototyper-openruyi-server-workstation-boot.sh
          .github/scripts/prototyper-openruyi-server-workstation-boot.sh --self-test

      - name: Install cargo-binutils
        uses: ./.github/actions/setup-cargo-binutils

      - name: Cache EDK II build
        if: matrix.boot-mode == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-26.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-mode == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      # The seed is an optimization. On a seed failure the boot script checks
      # the artifact and falls back to downloading the pinned image itself.
      - name: Download prepared openRuyi ${{ matrix.edition }} assets
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: openruyi-2026.09-${{ matrix.edition }}-assets
          path: .cache/openruyi/2026.09

      - name: Build RustSBI Prototyper
        run: |
          set -o pipefail
          mkdir -p qemu-logs
          cargo prototyper build 2>&1 | tee qemu-logs/prototyper-openruyi-build.log

      - name: Boot openRuyi ${{ matrix.edition }} through ${{ matrix.boot-mode }}
        run: .github/scripts/prototyper-openruyi-server-workstation-boot.sh "${{ matrix.edition }}" "${{ matrix.boot-mode }}"

      - name: Save EDK II build
        if: matrix.boot-mode == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-26.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-mode == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/smode-2026.07
          key: uboot-build-ubuntu-26.04-${{ runner.arch }}-2026.07-smode-2026.07-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload serial log and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openruyi-${{ matrix.edition }}-${{ matrix.boot-mode }}-logs
          path: qemu-logs/prototyper-openruyi-*.log
          if-no-files-found: warn
