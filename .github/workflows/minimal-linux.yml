name: Minimal Linux

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-boot.sh"
      - ".github/workflows/minimal-linux.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-boot.sh"
      - ".github/workflows/minimal-linux.yml"
      - ".github/scripts/ci-uboot.sh"
      - ".github/scripts/ci-edk2.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  minimal-linux-boot:
    name: Boot minimal Linux (${{ matrix.boot-path }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot-path:
          - sbi
          - u-boot
          - edk2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            e2fsprogs \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libc6-dev-riscv64-cross \
            libssl-dev \
            nasm \
            parted \
            python3 \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            qemu-utils \
            swig \
            uuid-dev \
            xz-utils
          qemu-system-riscv64 --version

          source .github/scripts/ci-uboot.sh
          toolchain_id=$(ci_uboot_toolchain_id)
          echo "CI_UBOOT_TOOLCHAIN_ID=$toolchain_id" >> "$GITHUB_ENV"
          source .github/scripts/ci-edk2.sh
          edk2_id=$(ci_edk2_build_id)
          echo "CI_EDK2_BUILD_ID=$edk2_id" >> "$GITHUB_ENV"

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # Both inputs are immutable releases, so the key only changes when a
      # pinned version does. Bump the trailing revision after editing the
      # build recipe in the script.
      - name: Cache Linux kernel and BusyBox builds
        uses: ./.github/actions/ci-cache
        with:
          path: |
            .cache/minimal-linux/linux-6.12.110-Image
            .cache/minimal-linux/busybox-1.36.1-install
          key: minimal-linux-kernel-6.12.110-busybox-1.36.1-v1

      - name: Cache EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Cache U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache
        with:
          path: .cache/ci-uboot/builds/minimal-linux-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-minimal-linux-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot minimal Linux
        run: .github/scripts/prototyper-minimal-linux-boot.sh "${{ matrix.boot-path }}"

      - name: Save Linux kernel and BusyBox builds
        uses: ./.github/actions/ci-cache-save
        with:
          path: |
            .cache/minimal-linux/linux-6.12.110-Image
            .cache/minimal-linux/busybox-1.36.1-install
          key: minimal-linux-kernel-6.12.110-busybox-1.36.1-v1

      - name: Save EDK II build
        if: matrix.boot-path == 'edk2'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-edk2/${{ env.CI_EDK2_BUILD_ID }}
          key: edk2-build-ubuntu-24.04-${{ runner.arch }}-${{ env.CI_EDK2_BUILD_ID }}

      - name: Save U-Boot build
        if: matrix.boot-path == 'u-boot'
        uses: ./.github/actions/ci-cache-save
        with:
          path: .cache/ci-uboot/builds/minimal-linux-spl
          key: uboot-build-ubuntu-24.04-${{ runner.arch }}-2024.04-minimal-linux-spl-${{ env.CI_UBOOT_TOOLCHAIN_ID }}-${{ hashFiles('.github/scripts/ci-uboot.sh') }}

      - name: Upload minimal Linux log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimal-linux-log-${{ matrix.boot-path }}
          path: qemu-logs/prototyper-minimal-linux-${{ matrix.boot-path }}.log
