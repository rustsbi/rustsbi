name: DCO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-commit-signatures:
    name: Check DCO sign-offs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO sign-offs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi

          mapfile -t commits < <(git rev-list "$BASE_SHA..$GITHUB_SHA")
          ((${#commits[@]} > 0)) || {
            echo "::error::No commits found in $BASE_SHA..$GITHUB_SHA"
            exit 1
          }

          failed=0
          for commit in "${commits[@]}"; do
            read -r -a parents <<<"$(git show -s --format='%P' "$commit")"
            if ((${#parents[@]} > 1)); then
              echo "Skipping merge commit $commit."
              continue
            fi

            author_name="$(git show -s --format='%an' "$commit")"
            author_email="$(git show -s --format='%ae' "$commit")"
            committer_name="$(git show -s --format='%cn' "$commit")"
            committer_email="$(git show -s --format='%ce' "$commit")"
            matched=0

            while IFS= read -r trailer; do
              key="${trailer%%:*}"
              value="${trailer#*:}"
              value="${value#"${value%%[![:space:]]*}"}"

              [[ "${key,,}" == "signed-off-by" ]] || continue
              if [[ "$value" =~ ^(.+)[[:space:]]\<([^\<\>]+)\>$ ]]; then
                signoff_name="${BASH_REMATCH[1]}"
                signoff_email="${BASH_REMATCH[2]}"
                if [[ "${signoff_name,,}" == "${author_name,,}" && "${signoff_email,,}" == "${author_email,,}" ]] ||
                   [[ "${signoff_name,,}" == "${committer_name,,}" && "${signoff_email,,}" == "${committer_email,,}" ]]; then
                  matched=1
                  break
                fi
              fi
            done < <(git show -s --format=%B "$commit" | git interpret-trailers --parse)

            if ((matched)); then
              echo "DCO sign-off verified for $commit."
            else
              echo "::error::Commit $commit lacks a Signed-off-by trailer matching its author or committer"
              git show -s --format='format:%h - %an <%ae> / %cn <%ce>%n%B' "$commit"
              failed=1
            fi
          done

          exit "$failed"
