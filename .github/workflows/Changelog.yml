name: Changelog

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_UNSTABLE_SPARSE_REGISTRY: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-changelogs:
    name: Check changelogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed_files.txt

      - name: Validate changes
        shell: bash
        run: |
          directories=(
            "library/sbi-rt"
            "library/sbi-spec"
            "library/sbi-testing"
            "library/rustsbi"
            "library/macros"
          )

          exit_code=0
          for directory in "${directories[@]}"; do
            changelog="$directory/CHANGELOG.md"
            if grep -q "^$directory/" changed_files.txt; then
              if ! grep -Fxq "$changelog" changed_files.txt; then
                echo "::error file=$changelog::Detected changes in $directory but $changelog was not updated"
                exit_code=1
              else
                echo "$changelog updated for changes in $directory."
              fi
            fi
          done

          exit $exit_code
