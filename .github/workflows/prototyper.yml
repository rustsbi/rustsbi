name: Prototyper

on:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check format
        run: cargo fmt --check

      # xtask tests convert RISC-V firmware with rust-objcopy.
      - name: Install required cargo
        run: cargo install --locked clippy-sarif@0.8.0 sarif-fmt@0.8.0 cargo-binutils@0.4.0

      - name: Run xtask unit tests
        run: cargo test --locked -p xtask

      # Build the prototyper before compiling or linting the firmware: its
      # plumbing build.rs consumes inputs generated by xtask.
      - name: Build cargo prototyper
        run: cargo prototyper build

      - name: Run test
        run: cargo test --locked -p rustsbi-prototyper -p rustsbi-prototyper-macros

      # The workspace target flags enable core_io for ArceBoot. Prototyper does
      # not use that unstable feature, so keep those flags out of this lint.
      - name: Run rust-clippy (Prototyper)
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set -o pipefail
          mkdir -p clippy-results
          cargo clippy --locked -p rustsbi-prototyper --target riscv64gc-unknown-none-elf --message-format=json \
            | clippy-sarif \
            | tee clippy-results/prototyper.sarif \
            | sarif-fmt

      - name: Run rust-clippy (test kernel)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p rustsbi-test-kernel --target riscv64imac-unknown-none-elf --message-format=json \
            | clippy-sarif \
            | tee clippy-results/test-kernel.sarif \
            | sarif-fmt

      - name: Run rust-clippy (bench kernel)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p rustsbi-bench-kernel --target riscv64imac-unknown-none-elf --message-format=json \
            | clippy-sarif \
            | tee clippy-results/bench-kernel.sarif \
            | sarif-fmt

      - name: Upload Prototyper analysis results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-results/prototyper.sarif
          category: rustsbi-prototyper
          wait-for-processing: true

      - name: Upload test-kernel analysis results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-results/test-kernel.sarif
          category: rustsbi-test-kernel
          wait-for-processing: true

      - name: Upload bench-kernel analysis results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-results/bench-kernel.sarif
          category: rustsbi-bench-kernel
          wait-for-processing: true

  qemu-boot-tests:
    name: Run prototyper QEMU boot tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc u-boot-tools

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      - name: Build QEMU boot artifacts
        shell: bash
        run: |
          cargo prototyper build
          cargo prototyper build jump
          cargo prototyper test --no-run
          cargo prototyper bench --no-run

      - name: Pack kernel images
        shell: bash
        run: |
          cargo prototyper test --pack --no-run
          cargo prototyper bench --pack --no-run
          test -s target/riscv64imac-unknown-none-elf/release/rustsbi-test-kernel.itb
          test -s target/riscv64imac-unknown-none-elf/release/rustsbi-bench-kernel.itb

      - name: Run payload test-kernel boot
        id: payload_test
        continue-on-error: true
        run: cargo prototyper test

      - name: Run dynamic test-kernel boot
        if: always()
        id: dynamic_test
        continue-on-error: true
        shell: bash
        run: .github/scripts/prototyper-qemu-boot.sh dynamic test

      - name: Run jump test-kernel boot
        if: always()
        id: jump_test
        continue-on-error: true
        shell: bash
        run: .github/scripts/prototyper-qemu-boot.sh jump test

      - name: Run payload bench-kernel boot
        if: always()
        id: payload_bench
        continue-on-error: true
        run: cargo prototyper bench

      - name: Run dynamic bench-kernel boot
        if: always()
        id: dynamic_bench
        continue-on-error: true
        shell: bash
        run: .github/scripts/prototyper-qemu-boot.sh dynamic bench

      - name: Run jump bench-kernel boot
        if: always()
        id: jump_bench
        continue-on-error: true
        shell: bash
        run: .github/scripts/prototyper-qemu-boot.sh jump bench

      - name: Validate QEMU boot matrix
        if: always()
        shell: bash
        run: |
          test "${{ steps.payload_test.outcome }}" = "success"
          test "${{ steps.dynamic_test.outcome }}" = "success"
          test "${{ steps.jump_test.outcome }}" = "success"
          test "${{ steps.payload_bench.outcome }}" = "success"
          test "${{ steps.dynamic_bench.outcome }}" = "success"
          test "${{ steps.jump_bench.outcome }}" = "success"

      - name: Upload QEMU log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prototyper-qemu-logs
          path: qemu-logs
