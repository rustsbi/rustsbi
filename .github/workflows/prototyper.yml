name: CI / Firmware

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    name: Select firmware checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ github.event_name == 'pull_request' || steps.paths.outputs.firmware == 'true' }}
      miralis: ${{ (github.base_ref || github.ref_name) == 'main' && steps.paths.outputs.miralis == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          base: main
          predicate-quantifier: some-with-excludes
          filters: |
            firmware:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
            miralis:
              - '.cargo/**'
              - '.github/scripts/prototyper-miralis-boot.sh'
              - '.github/workflows/{miralis,prototyper}.yml'
              - '.gitmodules'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'xtask/**'
              - 'library/**'
              - 'firmware/{prototyper,runtime}/**'
              - 'firmware/mbench'

  mbench:
    name: Resolve mbench/main
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || needs.changes.outputs.miralis == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          repository: rustsbi/mbench
          ref: main
          persist-credentials: false

  docker:
    needs: [changes, mbench]
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      mbench_sha: ${{ needs.mbench.outputs.sha }}

  miralis:
    needs: [changes, mbench]
    if: needs.changes.outputs.miralis == 'true'
    uses: ./.github/workflows/miralis.yml
    with:
      mbench_sha: ${{ needs.mbench.outputs.sha }}

  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check format
        run: cargo fmt --check

      # xtask tests convert RISC-V firmware with rust-objcopy.
      - name: Install required cargo
        run: cargo install --locked clippy-sarif@0.8.0 sarif-fmt@0.8.0 cargo-binutils@0.4.0

      - name: Run xtask unit tests
        run: cargo test --locked -p xtask --bin xtask

      # Build the prototyper before compiling or linting the firmware: its
      # plumbing build.rs consumes inputs generated by xtask.
      - name: Build cargo prototyper
        run: cargo prototyper build

      - name: Run test
        run: |
          cargo test --locked -p rustsbi-prototyper -p rustsbi-runtime-macros
          cargo test --locked -p rustsbi-firmware-runtime --lib

      - name: Run rust-clippy (Prototyper)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p clippy-results
          cargo clippy --locked -p rustsbi-prototyper --target riscv64gc-unknown-none-elf --message-format=json \
            | clippy-sarif \
            | tee clippy-results/prototyper.sarif \
            | sarif-fmt

      - name: Upload Prototyper analysis results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-results/prototyper.sarif
          category: rustsbi-prototyper
          wait-for-processing: true

  qemu-boot-tests:
    name: Run prototyper QEMU boot tests
    needs: [changes, mbench]
    if: needs.changes.outputs.firmware == 'true'
    # QEMU >= 9.1 fixes zero-valued CSRRS writes to read-only CSRs.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout mbench
        uses: actions/checkout@v7
        with:
          repository: rustsbi/mbench
          ref: ${{ needs.mbench.outputs.sha }}
          path: firmware/mbench
          persist-credentials: false

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-riscv u-boot-tools device-tree-compiler
          qemu-system-riscv64 --version

      - name: Install required cargo
        uses: ./.github/actions/setup-cargo-binutils

      - name: Run xtask QEMU integration tests
        run: cargo test --locked -p xtask --test prototyper_cli

      - name: Run payload mbench check boot
        id: payload_test
        continue-on-error: true
        run: cargo prototyper test --out qemu-logs/prototyper-payload-test-virt.log

      - name: Run dynamic mbench check boot
        if: always()
        id: dynamic_test
        continue-on-error: true
        shell: bash
        run: |
          cargo prototyper test --mode dynamic --pack --out qemu-logs/prototyper-dynamic-test-virt.log
          test -s target/mbench/test-0x80200000/mbench.itb

      - name: Run dynamic ACLINT mbench check boot
        if: always()
        id: dynamic_aclint_test
        continue-on-error: true
        run: cargo prototyper test --mode dynamic --machine virt,aclint=on --out qemu-logs/prototyper-dynamic-test-virt_aclint_on.log

      - name: Run jump mbench check boot
        if: always()
        id: jump_test
        continue-on-error: true
        run: cargo prototyper test --mode jump --out qemu-logs/prototyper-jump-test-virt.log

      - name: Run payload mbench bench boot
        if: always()
        id: payload_bench
        continue-on-error: true
        run: cargo prototyper bench --out qemu-logs/prototyper-payload-bench-virt.log

      - name: Run dynamic mbench bench boot
        if: always()
        id: dynamic_bench
        continue-on-error: true
        shell: bash
        run: |
          cargo prototyper bench --mode dynamic --pack --out qemu-logs/prototyper-dynamic-bench-virt.log
          test -s target/mbench/bench-0x80200000/mbench.itb

      - name: Run jump mbench bench boot
        if: always()
        id: jump_bench
        continue-on-error: true
        run: cargo prototyper bench --mode jump --out qemu-logs/prototyper-jump-bench-virt.log

      - name: Validate QEMU boot matrix
        if: always()
        shell: bash
        run: |
          test "${{ steps.payload_test.outcome }}" = "success"
          test "${{ steps.dynamic_test.outcome }}" = "success"
          test "${{ steps.dynamic_aclint_test.outcome }}" = "success"
          test "${{ steps.jump_test.outcome }}" = "success"
          test "${{ steps.payload_bench.outcome }}" = "success"
          test "${{ steps.dynamic_bench.outcome }}" = "success"
          test "${{ steps.jump_bench.outcome }}" = "success"

      - name: Verify embedded DTB handoff outside firmware mappings
        shell: bash
        run: bash .github/scripts/prototyper-fdt-handoff.sh

      - name: Verify repeated M-mode payload interrupts
        shell: bash
        run: |
          bash .github/scripts/prototyper-machine-stack.sh 32
          bash .github/scripts/prototyper-machine-stack.sh 64

      - name: Upload QEMU log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prototyper-qemu-logs
          path: qemu-logs
