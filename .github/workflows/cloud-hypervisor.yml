name: Cloud Hypervisor

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-cloud-hypervisor-boot.sh"
      - ".github/workflows/cloud-hypervisor.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-cloud-hypervisor-boot.sh"
      - ".github/workflows/cloud-hypervisor.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cloud-hypervisor-boot:
    name: Boot Linux through KVM and Cloud Hypervisor (sbi)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils-riscv64-linux-gnu \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            gzip \
            libc6-dev-riscv64-cross \
            libelf-dev \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3-dev \
            python3-setuptools \
            python3-venv \
            zlib1g-dev \
            xz-utils

      - name: Install Rust build dependencies
        run: |
          rustup target add riscv64gc-unknown-linux-gnu
          cargo install --locked cargo-binutils@0.4.0

      - name: Fingerprint cross-build toolchain
        id: cache-fingerprint
        run: |
          fingerprint=$(
            {
              rustc --version
              cargo --version
              riscv64-linux-gnu-gcc --version | sed -n '1p'
              sha256sum /usr/riscv64-linux-gnu/lib/libc.so.6
            } | sha256sum
          )
          echo "value=${fingerprint%% *}" >>"$GITHUB_OUTPUT"

      - name: Cache QEMU build
        uses: actions/cache@v5
        with:
          path: .cache/qemu-10.2.2
          key: cloud-hypervisor-qemu-10.2.2-${{ runner.os }}-v1

      - name: Cache Linux, BusyBox, and Cloud Hypervisor builds
        uses: actions/cache@v5
        with:
          path: .cache/cloud-hypervisor
          key: cloud-hypervisor-v53.0-linux-46b5aab6-busybox-1.36.1-${{ hashFiles('.github/scripts/prototyper-cloud-hypervisor-boot.sh') }}-${{ steps.cache-fingerprint.outputs.value }}

      - name: Build RustSBI Prototyper with hypervisor support
        run: cargo prototyper build --features hypervisor

      - name: Boot Linux through KVM and Cloud Hypervisor
        run: .github/scripts/prototyper-cloud-hypervisor-boot.sh

      - name: Upload Cloud Hypervisor boot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-hypervisor-boot-log
          path: qemu-logs/
          if-no-files-found: ignore
