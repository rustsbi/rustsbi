name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["C-enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and Use Cases
      description: Why is this feature useful? Describe relevant use cases.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed behavior or implementation, if any.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related specifications, SBI documentation, discussions, or issues.
