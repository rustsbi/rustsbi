[package]
name = "rustsbi-prototyper-mtest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rustsbi-prototyper-mtest"
test = false
bench = false

[dependencies]
machine = { package = "rustsbi-prototyper-machine", path = "../../machine", default-features = false }
mtest-macros = { package = "rustsbi-prototyper-mtest-macros", path = "../mtest-macros" }
sbi-testing = { path = "../../../library/sbi-testing" }
spin = "0.9.8"
uart-16550 = { package = "rustsbi-prototyper-uart-16550", path = "../../drivers/uart-16550" }
sifive-test = { package = "rustsbi-prototyper-sifive-test", path = "../../drivers/sifive-test" }
