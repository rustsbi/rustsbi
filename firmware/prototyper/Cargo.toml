[package]
name = "rustsbi-prototyper"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitflags = "2.9.1"
log = "0.4"
panic-halt = "1.0.0"
riscv = { workspace = true }
spin = "0.9.8"
cfg-if = "1.0.0"
sbi-spec = { version = "0.0.10", path = "../../library/sbi-spec" }
static-toml = "1"
seq-macro = "0.3.5"
pastey = "0.1.0"
riscv-aia = { version = "0.0.0", path = "../../library/riscv-aia" }
rustsbi-prototyper-macros = { version = "0.0.0", path = "../macros" }
runtime = { package = "rustsbi-firmware-runtime", version = "0.0.0", path = "../runtime" }

[[bin]]
name = "rustsbi-prototyper"
test = false
bench = false

[features]
nemu = []
payload = []
jump = []
fdt = []
hypervisor = []
