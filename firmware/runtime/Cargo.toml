[package]
name = "rustsbi-firmware-runtime"
description = "Runtime support for RustSBI firmware"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
test = true
bench = false

[dependencies]
fdt = "0.1.5"
riscv = { workspace = true }
riscv-decode = "0.2.1"
rustsbi = { version = "0.4.1", features = [
    "machine",
], path = "../../library/rustsbi" }
serde-device-tree = { git = "https://github.com/rustsbi/serde-device-tree", rev = "ffb4855", default-features = false }
spin = "0.9.8"
