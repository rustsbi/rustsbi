[package]
name = "rustsbi-firmware-runtime"
description = "Runtime support for RustSBI firmware"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
test = true
bench = false

[dependencies]
bitflags.workspace = true
macros = { package = "rustsbi-runtime-macros", version = "0.0.0", path = "macros" }
fdt = { workspace = true }
csr = { package = "rustsbi-csr", path = "lib/csr" }
riscv-decode = "0.2.1"
rustsbi = { version = "0.4.1", features = [
    "machine",
], path = "../../library/rustsbi" }
spin.workspace = true
seq-macro.workspace = true
